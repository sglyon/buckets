[package]
name = "buckets-plugin"
version = "0.1.0"
edition = "2024"
description = "Versioned, language-independent plugin protocol and host for Buckets"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
