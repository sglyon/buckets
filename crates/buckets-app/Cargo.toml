[package]
name = "buckets-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "buckets"
path = "src/main.rs"

[dependencies]
anyhow = "1"
buckets-core = { path = "../buckets-core" }
buckets-plugin = { path = "../buckets-plugin" }
buckets-terminal = { path = "../buckets-terminal" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
notify = "7"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSApplication", "NSView", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSWorkspace", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSDictionary", "NSData"] }

[dev-dependencies]
tempfile = "3"
